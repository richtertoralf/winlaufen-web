<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Konfiguration · WinLaufen Web</title><link rel="stylesheet" href="/assets/app.css"></head>
<body><header><a class="brand" href="/">WinLaufen <span>Web</span></a><a class="quiet-link" href="/renderer">Öffentliche Ansicht</a></header>
<main class="dashboard">
  <section class="setup-status" aria-label="Verbindungsstatus"><div><span id="health" class="pill disconnected">DISCONNECTED</span><div id="revision" class="revision">Revision 0</div></div><div class="status-data"><span>WinLaufen-Uhr</span><strong id="clock">--:--:--</strong></div></section>
  <form id="config-form"><div class="setup-grid">
    <section class="panel"><h1>WinLaufen</h1><label class="field-label" for="host">Rechner / Host</label><div class="source"><input id="host" name="winlaufenHost" required autocomplete="off"><span>Port 4444 · fest</span></div></section>
    <section class="panel"><h2>Ausgabe</h2><fieldset><legend class="visually-hidden">Output-Modus</legend>
      <label class="option"><input type="radio" name="outputMode" value="LOCAL" checked> LOCAL <span class="tag">aktiv</span></label>
      <label class="option disabled"><input type="radio" name="outputMode" value="SELFHOST" disabled> SELFHOST <span class="tag">später</span></label>
      <label class="option disabled"><input type="radio" name="outputMode" value="RICHTER_PROJECTS" disabled> RICHTER_PROJECTS <span class="tag">später</span></label>
    </fieldset></section>
    <section class="panel wide"><h2>Öffentliche Darstellung</h2>
      <label class="option"><input type="checkbox" name="showClub"> <span>Verein anzeigen</span></label>
      <label class="option"><input type="checkbox" name="showAssociation"> <span>Verband anzeigen</span></label>
      <label class="option"><input type="checkbox" name="showNation"> <span>Nation anzeigen</span></label>
      <h3>Biathlon</h3><label class="option"><input type="checkbox" name="showShooting"> <span>Schießergebnisse anzeigen<small>Blendet die von WinLaufen gelieferten Schießergebnisse in der öffentlichen Ansicht ein.</small></span></label>
      <h3>WinLaufen-Nachrichten</h3><label class="option"><input type="checkbox" name="showPublicMessages"> <span>Im öffentlichen Web anzeigen<small>Wenn aktiviert, werden Sprecher-PC-Nachrichten automatisch auch öffentlich angezeigt.</small></span></label>
    </section>
    <section class="panel wide"><h2>Öffentliche Adresse</h2><p id="renderer-address" class="address"></p><div class="actions"><button class="primary" type="submit">Speichern</button><a class="button secondary" href="/renderer">Ansicht öffnen</a><span id="form-message" class="muted" role="status"></span></div></section>
  </div></form>
</main><script src="/assets/dashboard.js" defer></script></body></html>
